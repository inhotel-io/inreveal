name: Docker Builder
description: Sets up Buildx, logs in to GHCR, and derives the digest/cache platform pair

inputs:
  github_token:
    description: 'Token used to log in to ghcr.io. Pass secrets.GITHUB_TOKEN.'
    required: true
  platform:
    description: 'Build platform (e.g. linux/amd64). Leave empty when the job does not build per-platform.'
    required: false
    default: ''

outputs:
  platform-pair:
    description: 'The platform with "/" replaced by "-" (e.g. linux-amd64). Used in cache scopes and digest artifact names.'
    value: ${{ steps.prepare.outputs.platform-pair }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - name: Login to GHCR
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.github_token }}

    - name: Prepare platform pair
      id: prepare
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: echo "platform-pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
