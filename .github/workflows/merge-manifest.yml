name: Merge Manifest

# Reusable: collects the per-platform digests a build job pushed by digest and
# creates one multi-arch manifest list under each requested tag.
#
# This is a reusable workflow rather than a composite action because the merge
# jobs never check the repository out — a local `uses: ./.github/actions/...`
# would force a checkout into every one of them, while a reusable workflow is
# resolved by GitHub itself and keeps the job checkout-free.

on:
  workflow_call:
    inputs:
      image:
        description: 'Fully-qualified image name, e.g. ghcr.io/open-noodle/gallery-server.'
        required: true
        type: string
      tags:
        description: 'Space-separated tag names to point at the manifest, e.g. "v5.2.0 v5 release".'
        required: true
        type: string
      digest-pattern:
        description: "download-artifact pattern matching this build job's digest artifacts."
        required: true
        type: string

permissions: {}

jobs:
  merge:
    name: Create manifest list
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.digest-pattern }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          tag_args=""
          for tag in ${TAGS}; do
            tag_args="${tag_args} -t ${IMAGE}:${tag}"
          done
          sources=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create ${tag_args} ${sources}
