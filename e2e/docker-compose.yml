name: immich-e2e

services:
  e2e-auth-server:
    container_name: immich-e2e-auth-server
    build:
      context: ../
      dockerfile: packages/e2e-auth-server/Dockerfile
    ports:
      - 2286:2286

  immich-server:
    container_name: immich-e2e-server
    image: immich-server:latest
    build:
      context: ../
      dockerfile: server/Dockerfile
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      IMMICH_TELEMETRY_INCLUDE: all
      IMMICH_ENV: testing
      IMMICH_PORT: '2285'
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS: 'true'
      IMMICH_AGENT_SECRET_KEY: e2e-agent-secret-key-change-me
      IMMICH_AGENT_RUNNER_URL: http://agent-runner:4477
      IMMICH_AGENT_TOOL_GATEWAY_URL: http://immich-server:2285/api/agent/internal/tools
      IMMICH_AGENT_RUNNER_HEALTH_TIMEOUT_MS: '5000'
      IMMICH_AGENT_RUNNER_MESSAGE_STREAM_TIMEOUT_MS: '30000'
    volumes:
      - ./test-assets:/test-assets
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
      agent-runner:
        condition: service_started
    ports:
      - 2285:2285

  agent-runner:
    container_name: immich-e2e-agent-runner
    build:
      context: ../
      dockerfile: agent-runner/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4477
      GALLERY_AGENT_RUNNER_RUNTIME: e2e
    ports:
      - 4477:4477

  redis:
    container_name: immich-e2e-redis
    image: ghcr.io/valkey-io/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich-e2e-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    ports:
      - 5435:5432
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s
